[project]
name = "tissue"
version = "0.1.0"
description = "Build, run and read tissue simulations from Python"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.5", "numpy>=1.22"]
dev = ["pytest>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tissue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
